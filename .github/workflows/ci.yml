name: SDK Java

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.java == '21'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          percent=$(python3 - << 'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("target/site/jacoco/jacoco.xml").getroot()
          counters = [item for item in root.findall("counter") if item.get("type") == "LINE"]
          if not counters:
              raise SystemExit("line coverage was not found")
          line = counters[-1]
          covered = int(line.get("covered"))
          missed = int(line.get("missed"))
          total = covered + missed
          if total == 0:
              raise SystemExit("line coverage was empty")
          print(f"{covered * 100 / total:.4f}")
          PY
          )
          bash .github/publish-coverage-badge.sh "$percent"
