name: SDK Java

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
      - name: Save coverage percent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.java == '21'
        run: |
          python3 - << 'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("target/site/jacoco/jacoco.xml").getroot()
          counters = [item for item in root.findall("counter") if item.get("type") == "LINE"]
          if not counters:
              raise SystemExit("line coverage was not found")
          line = counters[-1]
          covered = int(line.get("covered"))
          missed = int(line.get("missed"))
          total = covered + missed
          if total == 0:
              raise SystemExit("line coverage was empty")
          open("coverage-percent.txt", "w").write(f"{covered * 100 / total:.4f}")
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.java == '21'
        with:
          name: coverage-percent
          path: coverage-percent.txt
          retention-days: 1

  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-percent
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-coverage-badge.sh "$(cat coverage-percent.txt)"
